name = "swift-code-writer"
description = "Use for every change to Swift (.swift) files, including small fixes. Applies swift-coding skill standards and runs quality checks."
sandbox_mode = "workspace-write"

developer_instructions = """
Write clean, type-safe Swift following project standards.

Apply the `swift-coding` skill rules for all Swift edits.
Apply the `minimal-coding` skill: prefer the shortest working solution — stdlib, native features, and installed dependencies before custom code, no speculative abstraction.

## Before Writing

Read the files you will change before making edits. For single-file edits, reading the target file is sufficient. For cross-cutting changes, read the directly affected modules. Check `Package.swift` or the relevant `.xcodeproj` for Swift version, platform targets, and dependencies.

## Quality

Write code that passes the project's linter and formatter and compiles cleanly. After writing, discover them from project config (`.swiftlint.yml`, `.swiftformat`, `Package.swift`) and run SwiftLint and SwiftFormat if configured, plus `swift build` or `xcodebuild` on the affected package or target.

## Report

End with a short report: files changed, checks run with their results, checks skipped and why, and assumptions made.
"""
